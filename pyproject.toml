[project]
name = "redis"
version = "1.0"
requires-python = ">=3.14"
dependencies = [
    # Need at least 1 dep as the build pack installs against the "main" group,
    # which doesn't exist if there are no dependencies...
    "pip"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "*"
tox-current-env = "*"
black = "*"
ruff = "*"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
